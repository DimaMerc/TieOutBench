# =============================================================================
# cases/grbo-redeem-2026.case.yaml — GOLD case: an in-kind ETF REDEMPTION whose basket is
# four FLEX option legs on IWM plus a cash component, processed EX-CLEARING, that does NOT
# tie. Three OCC position-transfer confirmations match the basket (120 contracts each); the
# long-put leg confirms 12,000 contracts - the order's UNDERLYING-SHARE EQUIVALENT (120 x 100)
# keyed as the contract count. The ETF agent's recap nevertheless shows 4 of 4 legs
# "TRANSFERRED" and READY TO SETTLE. Gold answer: HOLD - do not release the cash component,
# cancel the shares or mark the order settled; corrective OCC transfer of 11,880 contracts
# back to the fund first; localized to that leg.
# -----------------------------------------------------------------------------
# SOURCING (read this): the redemption basket for an order, the OCC confirmations, the
# custodian's position report and the ETF agent's recap are NOT public documents. So, like
# evals #4 and #7, this case is a CONSTRUCTED, mechanics-faithful scenario:
#   * the PROCESS PAIN is documented by the clearing house itself. NSCC rule filing
#     SR-NSCC-2026-001 (Federal Register, Jan 29, 2026; SEC notice 34-104687, Jan 26, 2026;
#     approved by 34-104981, Mar 12, 2026): for ETFs with option components "the entire
#     redemption process is generally managed ex-clearing, requiring multiple manual steps to
#     ensure completion, including the tracking, pricing, validation and ultimate execution of
#     options positions transfers at OCC by the APs, ETF Agents and primer brokers [sic]";
#     "This process, as it stands, is fragmented and heavily dependent on manual intervention,
#     which increases the potential for errors and operational" risk; processed "without the
#     benefit of NSCC's CCP guaranty". The filing quantifies nothing; the specific error
#     planted here (contracts vs underlying shares) is constructed, not attributed to any
#     real incident;
#   * the CONTRACT SPECIFICATIONS are real: FLEX options on IWM carry the OCC root 4IWM in
#     the OSI identifier, multiplier 100, European exercise, physical settlement, and expire
#     on the last business day of the outcome period (verified against a real N-PORT filing
#     in eval #2; 2026-09-30 is the real October-vintage expiry). The UNDERLYING (IWM) is real;
#   * the reference price (a round 240.00), the strikes and the marks are REPRESENTATIVE and
#     internally consistent, not actual market levels; the FUND, the AP, the clearing
#     members, the custodian, the ETF agent and the break are ILLUSTRATIVE. "Granite Ridge" is
#     the suite's fictitious issuer (eval #4's GRIN, eval #7's GRSL). Any coincidence between
#     the constructed series and a listed FLEX series is incidental.
#
# THE MECHANICS (real; see workflow/options-redemption-analysis.md for the items flagged for
# domain review): the PCF for the trade date gives the basket per creation unit - for each
# leg the series, the side, the contracts per unit (and the underlying-share equivalent,
# contracts x 100) - and the cash component per unit = unit value (NAV x shares per unit)
# minus the value of the legs delivered (sum of contracts x 100 x mark x sign). The AP
# delivers the shares free of payment at DTC; the fund's clearing member transfers each leg
# to the AP's clearing member at OCC (long legs as long positions, written legs as short
# positions the receiver must accept); the cash component less the transaction fee is wired.
# Nothing passes through NSCC's CNS. The tie-out: each confirmation's series, quantity, side
# and status against the basket x units; the fund's post-transfer position against the
# pre-transfer position minus the due quantity; the cash component recomputed from the NAV
# and the marks; the shares received. SETTLE only if every leg ties.
#
# THE BREAK: due per leg = 60 contracts/unit x 2 units = 120. Confirmations L1, L3, L4: 120.
# Confirmation L2 (long put 240.00): 12,000 - the fund held 24,000 so OCC processed it and the
# receiving clearing member accepted a free long position. Excess 11,880 contracts x 100 x
# 3.95 = 4,692,600.00 delivered to the AP in error; the fund's long put stands at 12,000
# against 23,880 due; 0.2358 per remaining share (0.77% of NAV) if not recovered. The cash
# component (9,200.00; 8,700.00 net of the 500.00 fee) is RIGHT - the delivery is not.
#
# MECHANICS VERIFICATION (2026-10-21, outputs/eval8-live/MECHANICS-NOTE.md - public primary documents only):
#   CONFIRMED: redemptions of option-component ETFs run "ex-clearing" outside NSCC with the option legs moved
#     at OCC (SR-NSCC-2026-001); OCC calls the move a position ADJUSTMENT / off-floor transfer (OCC By-Laws
#     Art. VI s.1 Interp. .01(a)(7), added by SR-OCC-2025-010, SEC Rel. 34-103521) and its rules test only that
#     the delivering account holds enough contracts (Art. VI s.15), so a 12,000-of-24,000 transfer passes the
#     real check; the cash component = unit NAV minus the delivered legs "less the applicable Redemption
#     Transaction Fee", the 4:00 p.m. ET cut-off and T+1 regular-way settlement (Innovator SAI; NSCC); "ETF
#     Agent" = NSCC's Index Receipt Agent; PCF by 10:00 PM ET on T-1, supplemental to noon on T (DTCC); the
#     custodian "instruct[s] the Transfer Agent as to the cancellation of the corresponding Shares"; the fund
#     holds its FLEX positions "through accounts at clearing members"; FLEX legs "all European style".
#   CONSTRUCTED / ILLUSTRATIVE (no public source found): the receiving clearing member's acceptance step and
#     the 17:10 / 18:05 / T+1 timings; the per-transfer "confirmation" documents (OCC publishes position
#     information, Rule 501; these rows render it); the ETF agent's status report ("recap"); the OSI and
#     underlying-share columns of the PCF (NSCC says PCFs carry "the shares and their associated quantities"
#     for option components); the AP clearing for itself; the share leg described as free of payment (the SAI
#     says shares go "through DTC to the transfer agent", AP agreements say shares via DTC and cash via Fedwire).
#   REPRESENTATIVE, NOT TYPICAL: the 50,000-share unit and the $500 fee (Innovator's 2025 N-CEN: mostly 25,000
#     shares and $300; First Trust $250; Calamos $300).
#   DATING: DTCC's ETF Release page lists NSCC's Options ETF Clearing Connect (the NSCC-to-OCC link) as in
#     production on May 15, 2026 - before this trade date. The fixture's AP and ETF agent have not onboarded to
#     it and process the order under their pre-existing bilateral arrangement; NSCC "would not guarantee
#     position transfers" either way. The messaged flow is a planned case. The keyed quantity is a manual-flow
#     risk: in the messaged flow "instructions would be created by using the daily portfolio composition files".
# =============================================================================

