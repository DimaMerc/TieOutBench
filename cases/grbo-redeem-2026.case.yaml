sources:
  process_basis:
    note: "NSCC SR-NSCC-2026-001 (FR Jan 29, 2026; approved Mar 12, 2026): options-component ETF redemptions
           'generally managed ex-clearing, requiring multiple manual steps ... tracking, pricing, validation and
           ultimate execution of options positions transfers at OCC'; 'fragmented and heavily dependent on manual
           intervention, which increases the potential for errors'. The specific error here is constructed."
  contract_basis:
    note: "FLEX options on IWM: OCC root 4IWM (OSI), multiplier 100, European exercise, physical settlement,
           expiry on the last business day of the outcome period - conventions verified in eval #2 against a real
           N-PORT filing. The series, strikes and marks in this packet are constructed and representative."
  mechanics_note:
    note: "every mechanical assertion of this packet was checked against public primary documents on 2026-10-21;
           the verdicts, verbatim quotes and URLs are in outputs/eval8-live/MECHANICS-NOTE.md and summarised in the
           header of this file (CONFIRMED / CONSTRUCTED / REPRESENTATIVE / DATING)."
  order_note:
    note: "the packet carries NO record of the AP's purchase price or cost basis for the 100,000 GRBO shares it
           tenders, and NO exchange closing price for GRBO shares; the AP's profit or loss on the redemption is
           therefore NOT computable from the packet (D2 probe)."

