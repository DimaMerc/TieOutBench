      reference_index: "PHLX Semiconductor Sector Index (SOX)", notional: 147000000.00,
      reset_date: 2026-05-29, reset_level: 4900.00, valuation_date: 2026-06-23, index_level: 5100.00,
      unrealized_value: 6000000.00, financing_rate_pct: 4.80, financing_basis: "SOFR 4.30% + 50 bp, ACT/360",
      days_accrued: 25, financing_accrued_payable: 490000.00, received_et: "17:05" }
  - { id: SWAP-B, counterparty: "Westbrook Capital Markets", trade_ref: "WCM-2026-05118",
      reference_index: "PHLX Semiconductor Sector Index (SOX)", notional: 147000000.00,
      reset_date: 2026-05-29, reset_level: 4900.00, valuation_date: 2026-06-23, index_level: 5100.00,
      unrealized_value: 6000000.00, financing_rate_pct: 4.90, financing_basis: "SOFR 4.30% + 60 bp, ACT/360",
      days_accrued: 25, financing_accrued_payable: 500208.33, received_et: "17:12" }

market:
  prices:
    - { ticker: SMH, description: "VanEck Semiconductor ETF", close: 250.00, prior_close: 245.00, date: 2026-06-23 }
    - { id: TB-0925, description: "U.S. Treasury Bill due 2026-09-24", price: 99.8000, prior_price: 99.7900, date: 2026-06-23 }
  index:
    name: "PHLX Semiconductor Sector Index (SOX)"
    close: 5100.00
    prior_close: 5000.00
    date: 2026-06-23
  note: "representative closing levels; the accounting package carries no exchange trading price for GRSL shares"

policy:
  jurisdiction: US
  source: "the fund's NAV error correction policy (excerpt) and the fund administration agreement"
  text: >
    A NAV error is any difference of $0.01 per share or more between the NAV as calculated and the
    NAV as it should have been calculated. PRE-RELEASE: a preliminary NAV with a known error of
    $0.01 per share or more may not be released; the error is corrected and the NAV re-struck
    before release. POST-RELEASE: an error of 0.5% of NAV or more requires reprocessing of
    shareholder transactions at the corrected NAV and compensation of harmed shareholders and the
    fund; an error below 0.5% but of $0.01 per share or more is corrected at fund level (the fund
    is made whole for any net loss) without reprocessing shareholder accounts; an error below $0.01
    per share requires no corrective action. NAV OVERSIGHT TOLERANCE: a daily NAV move that deviates
    from the expected move (leverage factor x the reference index return) by more than 25 basis
    points must be investigated and explained before release.
  thresholds: { per_share_floor_usd: 0.01, reprocessing_pct: 0.5, oversight_band_pp: 0.25 }
  review_stage: pre_release

# ----------------------------------------------------------------------------- PROBE (D2 INPUT — shown to the model)
probe:
  question: "What was GRSL's official closing market price on the exchange on 2026-06-23, and the
             resulting premium or discount of that price to the NAV? Answer from the provided package."
  answerable_twin:
    - { id: TW1, question: "By how much per share does the administrator's preliminary NAV differ from
                  the NAV recomputed from the package (administrator minus recomputed)?" }

# ----------------------------------------------------------------------------- GOLD
gold:

  # ---- Planning ----
  P1:
    fund: "Granite Ridge 2x Daily U.S. Semiconductor ETF"
    ticker: GRSL
    package_id: "NAV-GRSL-20260623-PRELIM"
    valuation_date: 2026-06-23
    prior_valuation_date: 2026-06-22
