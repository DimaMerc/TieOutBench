# =============================================================================
# cases/grsl-nav-2026-clean.case.yaml — the OVER-CAUTIOUS MIRROR of grsl-nav-2026.
# Same fund, same valuation date, same positions and inputs - but the Westbrook
# valuation file arrived before the pricing cut-off, so the administrator's SWAP-B
# mark is current (6,000,000.00, price date 2026-06-23). The package TIES: the
# recomputed NAV equals the administrator's 51.9912, and the day's move (+3.98%) sits
# inside the oversight band around the expected 2 x 2.00% = 4.00%. Gold answer:
# RELEASE. A NAV oversight control that HOLDS a correct NAV is as useless as one that
# releases a wrong one; without this case a perma-holder would AllPass.
# -----------------------------------------------------------------------------
# Sourcing, mechanics and labeling: see grsl-nav-2026.case.yaml (constructed scenario;
# SMH and SOX real; fund, swaps, counterparties and administrator illustrative).
# =============================================================================

case_id: grsl-nav-2026-clean
suite: nav-oversight
rubric_version: "1.0.0"
authored_from_primary_sources: false      # constructed scenario (NAV packages are not public) - see header

# ----------------------------------------------------------------------------- MANIFEST
manifest:
  fund: "Granite Ridge 2x Daily U.S. Semiconductor ETF"
  ticker: GRSL
  fund_is_fictitious: true
  structure: "Rule 6c-11 ETF; 2x daily leveraged exposure to the PHLX Semiconductor Sector Index (SOX)
              via a physical ETF position plus two total return swaps; T-bill and cash collateral"
  package_id: "NAV-GRSL-20260623-PRELIM"
  valuation_date: 2026-06-23
  prior_valuation_date: 2026-06-22
  leverage: 2.0
  benchmark_index: "PHLX Semiconductor Sector Index (SOX)"
  nav_decimals: 4
  nav_tie_tolerance_usd: 0.001
  clean_package: true                     # the counterweight: the package ties; gold = RELEASE
  regime:
    jurisdiction: US
    per_share_floor_usd: 0.01
    reprocessing_pct: 0.5
    oversight_band_pp: 0.25
    review_stage: pre_release
  prices_note: "representative closing prices and index levels as of 2026-06-23 (public market data scale)"

sources:
  package_basis:
    note: "see grsl-nav-2026.case.yaml - constructed, mechanics-faithful; this is the clean mirror."
  market_note:
    note: "the accounting package carries NO exchange trading price for GRSL shares; the official
           closing market price and the premium/discount are NOT in this packet (D2 probe)."

# ----------------------------------------------------------------------------- NAV PACKAGE (INPUT — shown to the model)
